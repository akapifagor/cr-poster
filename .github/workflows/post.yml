name: CR offers -> Telegram
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
    inputs:
      backfill: {description: "Test: repost N newest offers (0 = normal run)", default: "0"}
permissions: {contents: write}
concurrency: {group: poster}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: if [ "${{ inputs.backfill || 0 }}" != "0" ]; then python main.py --backfill ${{ inputs.backfill }}; else python main.py; fi
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add seen.json; git diff --cached --quiet || (git commit -m "seen" && git push)
