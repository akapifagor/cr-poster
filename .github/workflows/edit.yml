name: Re-render old posts
on:
  workflow_dispatch:
    inputs:
      n: {description: "How many latest channel messages to check", default: "100"}
      below: {description: "Only messages with id below this (0 = all)", default: "0"}
concurrency: {group: poster}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python edit.py ${{ inputs.n }} ${{ inputs.below }}
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
