name: Watchdog (restarts the poster)
# The poster restarts itself; this only covers a broken chain (crash, cancelled run, GitHub outage).
on:
  schedule: [{cron: "4,19,34,49 * * * *"}]  # off the :00/:30 peak; GitHub may still delay it
  workflow_dispatch:
permissions: {actions: write}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env: {GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}"}
        run: |
          busy=$(gh api "repos/$REPO/actions/runs?per_page=50" --jq '[.workflow_runs[] | select(.status != "completed" and (.path | test("/(post|edit|emoji)\\.yml")))] | length')
          if [ "$busy" = "0" ]; then gh workflow run post.yml -R "$REPO"; echo "poster was not running -> started"; else echo "poster is running ($busy)"; fi
