name: AI test (no posting)
on:
  workflow_dispatch:
    inputs:
      model: {description: "Model to test (empty = config ai_model)", default: ""}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python main.py --ai-test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MODEL: ${{ inputs.model }}
          AI_FALLBACK_MODEL: ${{ inputs.model }}
          PYTHONUNBUFFERED: "1"
